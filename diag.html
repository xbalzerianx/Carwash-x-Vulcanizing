<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KG Car Services — Connection Test</title>
<style>
  body{background:#1E1E22;color:#F7F7F7;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;padding:28px;margin:0}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:#7A7A85;font-size:13px;margin:0 0 24px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#2B2B31;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px 18px;margin-bottom:10px;font-size:14px}
  .row .name{font-weight:600}
  .row .meta{color:#7A7A85;font-size:12px}
  .ok{color:#4CAF50;font-weight:700}
  .fail{color:#D94A4A;font-weight:700}
  .run{color:#D4AF37}
  button{background:#D94A4A;color:#fff;border:0;border-radius:10px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:22px}
  #summary{margin-top:20px;padding:16px;background:#2B2B31;border-radius:10px;font-size:13px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<h1>🚗 KG Car Services — Connection Test</h1>
<p class="sub">This page checks each data source directly. Take a screenshot of the results and send it to Carwash.</p>
<button onclick="runAll()">Run Test</button>
<div id="results"></div>
<div id="summary"></div>
<script>
const API_URL = 'https://superagent-f43a5097.base44.app/functions/apiHandler';
const APP_ID  = '6a1c42f697e43e4ff43a5097';
const ENTITIES = ['Employee','Service','CarWash','RewardCampaign','CommissionPayout','ActivityLog','VulcanizingJob','VulcanizingProduct','KgWorkOrder','KgAbsence'];

async function runAll(){
  const results=document.getElementById('results');
  const summary=document.getElementById('summary');
  results.innerHTML=''; summary.textContent='';
  const lines=[];
  for(const e of ENTITIES){
    const row=document.createElement('div');
    row.className='row';
    row.innerHTML='<span class="name">'+e+'</span><span class="meta run">Testing…</span>';
    results.appendChild(row);
    const t0=Date.now();
    try{
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),90000);
      const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','x-base44-app-id':APP_ID},body:JSON.stringify({action:'list',entity:e}),signal:controller.signal});
      clearTimeout(timer);
      const ms=Date.now()-t0;
      const text=await res.text();
      let count='?';
      try{const j=JSON.parse(text);count=Array.isArray(j.data)?j.data.length:'?';}catch(_){}
      const kb=(text.length/1024).toFixed(0);
      row.innerHTML='<span class="name">'+e+'</span><span class="meta"><span class="ok">OK</span> · '+count+' records · '+kb+' KB · '+ms+'ms · HTTP '+res.status+'</span>';
      lines.push(e+': OK, '+count+' records, '+kb+' KB, '+ms+'ms, HTTP '+res.status);
    }catch(err){
      const ms=Date.now()-t0;
      const msg=(err&&err.name==='AbortError')?'Timed out after 90s':(err.message||'Network error');
      row.innerHTML='<span class="name">'+e+'</span><span class="meta"><span class="fail">FAILED</span> · '+msg+' · '+ms+'ms</span>';
      lines.push(e+': FAILED — '+msg+' ('+ms+'ms)');
    }
  }
  lines.push('User agent: '+navigator.userAgent);
  lines.push('Time: '+new Date().toString());
  lines.push('Timezone: '+(Intl.DateTimeFormat().resolvedOptions().timeZone||'unknown'));
  summary.textContent='— COPY THIS —\n'+lines.join('\n');
}
</script>
</body>
</html>
